<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Audio Controls</title>
    </head>
    <body>
        <H1>Audio Controls in HTML</H1>
        <p>
            In this we are gonna use Audio controls.<br>
            <h5>Controls: </h5>
            Autoplay<br>Loop<br>Muted.<br>
            <audio controls autoplay loop muted>
                <source src="Audio.mp3.mp3" type="audio/mp3">
                <source src="Audio.ogg.ogg" type="audio/ogg">
            </audio>
        </p>
    </body>
</html>
