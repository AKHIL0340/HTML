<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Progress in HTML</title>
    </head>
    <body>
        <h1>Progress using HTML</h1>
        <p>
            In this page will dispaly the PROGRESS bar using.<br>
            "progress" tag this tag is mainly used in showing the progress of download.<br>
            <label for="download">Download Progress:</label>
            <progress id="download" max="100" value="65">
                65%
            </progress><br>
            Without Max:<br>
            <progress value="30"></progress><br>
            No Values:<br>
            <progress></progress>
        </p>
    </body>
</html>
