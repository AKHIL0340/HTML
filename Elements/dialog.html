<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Output in HTML</title>
    </head>
    <body>
        <h1>Dialogs in HTML:</h1>
        <dialog id="mydialog">
        <h4>HIHEELOOOHIIIHIII</h4>
        <p>This is a dialog box.</p>
        <button onclick="mydialog.close()">Close</button>
        </dialog>
        <button onclick="mydialog.showModal()">Open Dialog</button>
    </body>
</html>
