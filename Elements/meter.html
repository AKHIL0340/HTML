<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Meter in HTML</title>
    </head>
    <body>
        <h1>Meter using HTML</h1>
        <p>
            In this page will dispaly the PROGRESS bar using.<br>
            "progress" tag this tag is mainly used in showing the progress of download.<br>
            <label for="Storage">Storage Used:</label>
            <meter id="Storage" min="0" max="100"
            low="30"
            high="80"
            optimum="65"
            value="28">28%
            </meter>
        </p>
    </body>
</html>
