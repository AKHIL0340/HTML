<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Audio Controls</title>
    </head>
    <body>
        <H1>Video Controls in HTML</H1>
        <p>
            In this we are gonna use Video controls.<br>
            <h5>Controls: </h5>
            Autoplay ,Loop ,Muted<br>
            <video controls width="500" height="430"autoplay loop muted>
                <source src="video.mp4"type="video/mp4"/>
                <source src="video.ogg"type="video/ogg"/>
            </video>
        </p>
    </body>
</html>
