<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Nested Tables</title>
        <body>
            <table border="1">
                <caption>Nested Tabels</caption>
                <tr>
                    <th>Employee Id</th>
                    <th>Employee Name</th>
                    <th>Department</th>
                    <th>Skills</th>
                </tr>
                <tr>
                    <td >101</td>
                    <td>Ravi</td>
                    <td>Development</td>
                    <td>
                        <table border="1">
                            <tr>
                                <th>Skills</th>
                                <th>Experience</th>
                            </tr>
                            <tr>
                                <td>HTML</td>
                                <td>3 Years</td>
                            </tr>
                            <tr>
                                <td>CSS</td>
                                <td>2 Years</td>
                            </tr>
                            <tr>
                                <td>JavaScript</td>
                                <td>2 Years</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>John</td>
                    <td>Testing</td>
                    <td>
                        <table border="1">
                            <tr>
                                <th>Skills</th>
                                <th>Experience</th>
                            </tr>
                            <tr>
                                <td>Manual Testing</td>
                                <td>3 Years</td>
                            </tr>
                            <tr>
                                <td>Selenium</td>
                                <td>2 Years</td>
                            </tr>
                        </table>
                    </td>
                </tr>                
            </table>
        </body>
    </head>
</html>
