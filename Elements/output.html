<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Output in HTML</title>
    </head>
    <body>
        <h1>Output in HTML</h1>
        <h4>Lets make Calculations:</h4>
        <form oninput="Sum.value = Number(a.value) + Number(b.value)"> 
        <input type="number" id="a" name="b" value="30">+
        <input type="number" id="b" name="b" value="40">=
        <output name="Sum">70</output>
        </form>
    </body>
</html>
