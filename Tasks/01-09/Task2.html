<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Tables</title>
        <body>
            <table border="1">
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Amount</th>
                </tr>
                <tr>
                    <td>Laptop</td>
                    <td>1</td>
                    <td>Rs.50,000</td>
                    <td>Rs.50,000</td>
                </tr>
                <tr>
                    <td>Mouse</td>
                    <td>2</td>
                    <td>Rs.1000</td>
                    <td>Rs.2000</td>
                </tr>
                <tr>
                    <th colspan="3">Grand Total</th>
                    <th>Rs.52,000</th>
                </tr>
            </table>
        </body>
    </head>
</html>
